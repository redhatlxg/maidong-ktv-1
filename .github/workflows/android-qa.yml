name: Android QA Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Validate mobile JavaScript
        run: |
          node --check app/src/main/assets/mobile/app.js
          node --check app/src/main/assets/mobile/ktv_api.js
          node -e 'const fs=require("fs");const s=fs.readFileSync("app/src/main/assets/mobile/app.js","utf8");if(/(^|[^$])\$\("\[data-singer-group\]"\)\.forEach/m.test(s)){console.error("Invalid single-element selector used as a collection");process.exit(1)}'

      # Package the installable QA APK first; tests run afterward and their result remains visible.
      - name: Build QA APK
        id: build-apk
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload QA APK
        if: always() && steps.build-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: maidong-ktv-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
