name: Android QA Build

on:
  push:
    branches: [master, 'ui/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" "platform-tools"

      - name: Validate mobile JavaScript
        run: |
          node --check app/src/main/assets/mobile/app.js
          node --check app/src/main/assets/mobile/ktv_api.js
          node <<'NODE'
          const fs = require("node:fs");
          const js = fs.readFileSync("app/src/main/assets/mobile/app.js", "utf8");
          const invalidCollections = [
            /(?<!\$)\$\(["'][^"']+["']\)\.forEach\s*\(/g,
            /(?<!\$)\$\(["'][^"']+["']\)\.map\s*\(/g
          ];
          for (const pattern of invalidCollections) {
            const matches = js.match(pattern) || [];
            if (matches.length) {
              console.error("Single-element query used as a collection:", matches.join(", "));
              process.exit(1);
            }
          }
          console.log("Mobile selector collection checks passed");
          NODE

      - name: Validate Xiaoxiaoya branding
        run: |
          node <<'NODE'
          const fs = require("fs");
          const app = fs.readFileSync("app/src/main/res/values/strings.xml", "utf8");
          const html = fs.readFileSync("app/src/main/assets/mobile/index.html", "utf8");
          const js = fs.readFileSync("app/src/main/assets/mobile/app.js", "utf8");
          const main = fs.readFileSync("app/src/main/java/com/local/ktv/MainActivity.kt", "utf8");
          const checks = [
            ["launcher name", app.includes('<string name="app_name">晓晓呀</string>')],
            ["mobile title", html.includes("<title>晓晓呀")],
            ["mobile heading", html.includes("<h1>晓晓呀</h1>")],
            ["mobile connection status", js.includes("已连接晓晓呀") && js.includes("正在连接晓晓呀")],
            ["TV heading", main.includes('label("晓晓呀"')]
          ];
          const failed = checks.filter(([, ok]) => !ok);
          if (failed.length) {
            for (const [name] of failed) console.error("Brand check failed: " + name);
            process.exit(1);
          }
          console.log("Xiaoxiaoya branding checks passed");
          NODE

      # Package the installable QA APK first; tests run afterward and their result remains visible.
      - name: Build QA APK
        id: build-apk
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run unit tests
        id: unit-tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload QA APK
        if: always() && steps.build-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: maidong-ktv-qa-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
