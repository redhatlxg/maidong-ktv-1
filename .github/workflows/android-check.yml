name: Android and mobile checks

concurrency:
  group: android-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/mobile-singer-cards-ime]

jobs:
  mobile-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check mobile JavaScript syntax
        run: |
          node --check app/src/main/assets/mobile/app.js
          node --check app/src/main/assets/mobile/ktv_api.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests, debug/release builds and release lint
        run: ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease :app:lintRelease --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxiaoya-ktv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxiaoya-ktv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
