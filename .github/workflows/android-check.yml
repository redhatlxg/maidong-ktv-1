name: Android and mobile checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/mobile-singer-cards-ime]

jobs:
  mobile-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check mobile JavaScript syntax
        run: node --check app/src/main/assets/mobile/app.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
