name: Android APK build and verification

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify mobile JavaScript syntax
        run: node --check app/src/main/assets/mobile/app.js

      - name: Verify mobile page selectors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('app/src/main/assets/mobile/index.html', 'utf8');
          const js = fs.readFileSync('app/src/main/assets/mobile/app.js', 'utf8');
          const ids = new Set([...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]));
          const refs = [...new Set([...js.matchAll(/\$\("#([A-Za-z0-9_-]+)"\)/g)].map(m => m[1]))];
          const missing = refs.filter(id => !ids.has(id) && id !== 'micValue');
          if (missing.length) {
            console.error('Missing mobile DOM IDs:', missing.join(', '));
            process.exit(1);
          }
          console.log(`Checked ${refs.length} static selectors; optional micValue is allowed.`);
          NODE

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output and calculate checksum
        id: apk
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee "$APK.sha256"
          ls -lh "$APK" "$APK.sha256"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxiao-ktv-${{ steps.apk.outputs.version_name }}-debug-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.apk_path }}.sha256
          if-no-files-found: error
          retention-days: 30
